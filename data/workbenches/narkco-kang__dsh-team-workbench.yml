name: 智能体团队工作台
nameEn: Agent Team Workbench
category: operations
description:
  zh: 把一支具名智能体团队做成聊天应用：每个成员有自己的模型路由与头像，支持私聊与群聊；整个部门可以是一个智能体，内部子智能体按职能并行执行再由主管汇总；另有会话检索、长期记忆、语音输入与头像素材库。
  en: Turns a named agent team into a chat app with per-member model routes and avatars, private and group chats, department-as-agent orchestration (sub-agents run in parallel then the lead synthesizes), plus record search, long-term memory, voice input and an avatar library.
